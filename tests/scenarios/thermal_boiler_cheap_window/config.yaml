# A 200 L electric water heater with an 8-hour price profile whose cheapest
# two hours lie in the middle. The tank starts at 50 C, loses 2 K/h and must
# stay between 45 C and 55 C. Expected: heating moves into the cheap window
# as far as the temperature floor allows, and planned_temp_c traces the tank.
mqtt:
  host: localhost
  client_id: mimir-test

outputs:
  schedule: mimir/schedule
  current: mimir/current
  last_solve: mimir/status
  availability: mimir/status/availability

grid:
  import_limit_kw: 10.0
  export_limit_kw: 5.0

static_loads:
  base_load: {}

thermal_boilers:
  dhw:
    volume_liters: 200.0
    elec_power_kw: 3.0
    cop: 1.0
    setpoint_c: 55.0
    min_temp_c: 45.0
    cooling_rate_k_per_hour: 2.0
