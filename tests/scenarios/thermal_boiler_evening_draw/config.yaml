# A 180 L hot water tank in standby loss mode with a forecast evening draw.
# A 1 kW heater at COP 2.5 adds about 3 K per 15-minute step. The tank loses
# its datasheet standing loss of 90 W (at 45 K) in proportion to its
# temperature above the 18 C room, and must stay between 40 C and 55 C.
# It starts at 46 C. A 4 kW draw over two steps in the evening (2 kWh,
# about 10 K) would take it below the floor without heating first.
#
# Prices: expensive before and during the draw (0.40 to 0.52), cheap at night
# after it (0.10 to 0.145), all distinct so the optimal schedule is unique.
# Stored heat is valued at the average import price (about 0.35) at the end of
# the horizon, so heating only pays at night unless the draw forces it.
#
# Expected: the heater runs in the two cheapest pre-draw steps (0.400 and
# 0.4045), just enough that the draw leaves the tank at about 40.7 C, above the
# floor; then at night it refills to 55 C at the end, preferring later steps
# because a hotter tank loses more. Without the draw the heater would only run
# at night, so this scenario fails if the draw stops affecting dispatch.

mqtt:
  host: localhost
  client_id: mimir-test

outputs:
  schedule: mimir/schedule
  current: mimir/current
  last_solve: mimir/status
  availability: mimir/status/availability

grid:
  import_limit_kw: 10.0
  export_limit_kw: 5.0

static_loads:
  base_load: {}

thermal_boilers:
  dhw:
    volume_liters: 180.0
    elec_power_kw: 1.0
    cop: 2.5
    setpoint_c: 55.0
    min_temp_c: 40.0
    standby_loss_w: 90.0
    ambient_temp_c: 18.0
    use_draw_forecast: true
