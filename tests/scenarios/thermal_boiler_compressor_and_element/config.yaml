# A 180 L hot water tank heated by a heat pump compressor and a resistive
# element, over an 8-hour price profile: expensive, a cheap window, expensive
# again, then one hour of negative prices. The compressor delivers 2.0 kW of
# heat and draws 1.1 kW at 35 C rising to 1.9 kW at 58 C; it cannot heat
# above 55 C. The element delivers up to 6 kW up to 67 C, but the setpoint of
# 60 C caps heating. Prices inside the cheap and negative windows are all
# distinct, so the optimal schedule is unique. The compressor has run for 15 of its 60 minimum minutes
# when the solve starts, and the source is at 8 C.
#
# Expected: the compressor finishes its minimum run (3 remaining steps). In
# the cheap window only a small top-up is needed to reach 45 C at the end of
# the expensive block; a compressor start must run a full hour, so a short
# element burst is cheaper. During negative prices the element (COP 1, so the
# most paid-for electricity per kelvin) heats the tank until the step peak
# reaches the 60 C setpoint ceiling, above the compressor's 55 C limit. The
# two sources never share a step.
mqtt:
  host: localhost
  client_id: mimir-test

outputs:
  schedule: mimir/schedule
  current: mimir/current
  last_solve: mimir/status
  availability: mimir/status/availability

grid:
  import_limit_kw: 10.0
  export_limit_kw: 5.0

static_loads:
  base_load: {}

thermal_boilers:
  dhw:
    volume_liters: 180.0
    setpoint_c: 60.0
    min_temp_c: 45.0
    cooling_rate_k_per_hour: 2.0
    min_run_steps: 4
    compressor:
      heat_output_kw: 2.0
      elec_kw_at_temp:
        - temp_c: 35.0
          elec_kw: 1.1
        - temp_c: 58.0
          elec_kw: 1.9
      max_temp_c: 55.0
      source_ref_temp_c: 10.0
      elec_kw_per_k_source: 0.02
    element:
      power_kw: 6.0
      max_temp_c: 67.0
